name: APK Android (modelli MIT)

# Builds the Android app (Capacitor) from app/ and publishes the APK as a GitHub Release.
on:
  push:
    branches: [modelli-mit]
    paths:
      - 'app/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
      - 'models-mit/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-mit
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_NAME: 6.0.${{ github.run_number }}-mit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Dipendenze
        run: npm ci

      - name: Whisper dentro l'app (modello e runtime, niente download sul telefono)
        uses: actions/cache@v4
        with:
          path: |
            app/asr/whisper-base
            app/asr/ort
            app/asr/transformers.min.js
          key: asr-whisper-base-q8-tjs-4.3.2-ort-1.31.0-dev.20260914-8d85527a0

      - name: Scarica Whisper base (se non è in cache)
        run: |
          set -e
          W=app/asr/whisper-base; O=app/asr/ort
          mkdir -p $W/onnx $O
          for f in config.json generation_config.json preprocessor_config.json tokenizer.json tokenizer_config.json \
                   onnx/encoder_model_quantized.onnx onnx/decoder_model_merged_quantized.onnx; do
            [ -s "$W/$f" ] || curl -sSL --fail --retry 3 -o "$W/$f" "https://huggingface.co/Xenova/whisper-base/resolve/main/$f"
          done
          ORT=https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.0-dev.20260914-8d85527a0/dist
          for f in ort-wasm-simd-threaded.asyncify.mjs ort-wasm-simd-threaded.asyncify.wasm; do
            [ -s "$O/$f" ] || curl -sSL --fail --retry 3 -o "$O/$f" "$ORT/$f"
          done
          [ -s app/asr/transformers.min.js ] || curl -sSL --fail --retry 3 -o app/asr/transformers.min.js \
            "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2/dist/transformers.min.js"
          du -sh $W $O

      - name: Copia l'app web nel progetto Android
        run: npx cap sync android

      - name: Modelli come file .onnx unici (APK più leggero del base64)
        run: |
          python3 - <<'PY'
          import base64, glob, os
          d = 'android/app/src/main/assets/public/models'
          for name in ('guira',):
              parts = sorted(glob.glob(f'{d}/{name}.*.b64.txt'), key=lambda p: int(p.split('.')[-3]))
              raw = b''.join(base64.b64decode(open(p, 'rb').read().strip()) for p in parts)
              open(f'{d}/{name}.onnx', 'wb').write(raw)
              for p in parts: os.remove(p)
              print(name, len(parts), 'parti ->', len(raw), 'byte')
          # branch modelli-mit: no Demucs in the APK, only MIT models (SCNet, Mega 53 reduced, AudioSep)
          for p in glob.glob(f'{d}/demucs6.*.b64.txt'): os.remove(p)
          import shutil
          for name in ('scnet', 'mega'): shutil.copy(f'models-mit/{name}.onnx', f'{d}/{name}.onnx')
          print(sorted(os.listdir(d)))
          PY

      - name: App di prova separata (si installa accanto a quella normale)
        run: |
          sed -i 's/applicationId "com.emanuelec807.bachatalab"/applicationId "com.emanuelec807.bachatalab.mit"/' android/app/build.gradle
          sed -i 's#<string name="app_name">Bachata Lab</string>#<string name="app_name">Bachata Lab MIT</string>#; s#<string name="title_activity_main">Bachata Lab</string>#<string name="title_activity_main">Bachata Lab MIT</string>#' android/app/src/main/res/values/strings.xml
          grep -n applicationId android/app/build.gradle; grep app_name android/app/src/main/res/values/strings.xml

      - name: Compila l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=$VERSION_NAME

      - name: Firma l'APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # A secret keystore wins; otherwise the sideload key in the repo keeps every build updatable in place.
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ks.jks
          else
            cp android-signing/sideload.jks ks.jks
            KS_PASS=bachatalab-sideload
            KS_ALIAS=bachatalab
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks ks.jks --ks-key-alias "$KS_ALIAS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
            --out "BachataLab-$VERSION_NAME.apk" aligned.apk
          "$BT/apksigner" verify "BachataLab-$VERSION_NAME.apk"
          rm ks.jks
          ls -la BachataLab-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BachataLab-${{ env.VERSION_NAME }}
          path: BachataLab-*.apk

      - name: Release con l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ env.VERSION_NAME }}
          name: Bachata Lab MIT ${{ env.VERSION_NAME }} (APK di prova)
          body: |
            APK di prova del branch `modelli-mit` (solo modelli con licenza MIT: SCNet, Mega 53 ridotto, AudioSep), costruito da `${{ github.sha }}`.
            Si installa accanto all'app normale con il nome "Bachata Lab MIT".
            Scarica il file `.apk` qui sotto dal telefono e aprilo per installarlo
            (la prima volta Android chiede di consentire l'installazione da questa fonte).
          files: BachataLab-*.apk
          make_latest: false
          prerelease: true
